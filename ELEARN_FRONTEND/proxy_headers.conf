# Shared by every location that proxies to Django. X-Forwarded-Proto is what
# SECURE_PROXY_SSL_HEADER reads once the deployment terminates TLS.
# $http_host keeps the port; $host drops it, which would make every absolute URL
# Django builds (media, pagination links) point at the wrong port
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $http_host;
proxy_redirect off;
