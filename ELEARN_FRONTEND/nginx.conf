upstream backend {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    # lecture videos and course covers are uploaded through the API
    client_max_body_size 512m;

    # the SPA is static files; index.html is small and changes on every deploy
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;

    # ---- Django -------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend;
        include /etc/nginx/proxy_headers.conf;
    }

    location /admin/ {
        proxy_pass http://backend;
        include /etc/nginx/proxy_headers.conf;
    }

    # peer chat websocket; the JWT travels in the query string
    location /ws/ {
        proxy_pass http://backend;
        include /etc/nginx/proxy_headers.conf;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # ---- files off the shared volumes ---------------------------------------
    # admin / swagger assets, written by `collectstatic` in the web container
    location /static/ {
        alias /srv/static/;
        access_log off;
        expires 7d;
    }

    # uploads: covers, profile pictures, lecture videos and attachments
    location /media/ {
        alias /srv/media/;
        access_log off;
        expires 1d;
    }

    # ---- the SPA ------------------------------------------------------------
    # `expires` rather than `add_header`, which would drop the inherited security headers
    location = /index.html {
        expires -1;
    }

    location / {
        # routing is hash based, so no rewrite is needed; index.html is the only page
        try_files $uri $uri/ /index.html;
    }
}
